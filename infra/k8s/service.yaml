apiVersion: v1
kind: Service
metadata:
  name: simulator
  labels:
    app: simulator
spec:
  type: ClusterIP
  selector:
    app: simulator
  ports:
    - name: web
      port: 6001
      targetPort: 6001
    - name: api
      port: 6002
      targetPort: 6002
    - name: db
      port: 6003
      targetPort: 6003
    - name: cache
      port: 6004
      targetPort: 6004
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  labels:
    app: backend
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
    - name: http
      port: 5000
      targetPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: ml-service
  labels:
    app: ml-service
spec:
  type: ClusterIP
  selector:
    app: ml-service
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: recovery-service
  labels:
    app: recovery-service
spec:
  type: ClusterIP
  selector:
    app: recovery-service
  ports:
    - name: http
      port: 5002
      targetPort: 5002
